[package]
name = "thinkhub"
version = "0.5.1"
edition = "2021"
rust-version = "1.85"
publish = false
description = "ThinkHub: a native Linux ThinkPad dashboard"
license = "MIT"
repository = "https://github.com/marioyordanov20039-debug/ThinkHub"

[dependencies]
gtk = { package = "gtk4", version = "0.10", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thinkpad-dashboard = { path = ".." }

[profile.dev]
debug = 0

[profile.release]
strip = true
