name: ThinkHub
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.85.0 fmt --manifest-path gui/Cargo.toml --check
      - run: cargo +1.85.0 test --manifest-path gui/Cargo.toml --locked
      - run: cargo +1.85.0 clippy --manifest-path gui/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.85.0 build --manifest-path gui/Cargo.toml --release --locked

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        rust: ['1.85.0', stable]
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt,clippy
          rustup default '${{ matrix.rust }}'
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: sh -n scripts/install-local.sh scripts/uninstall-local.sh
      - run: python3 scripts/check-staging.py

  distro-fixtures:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'debian:12', 'fedora:latest', 'archlinux:latest']
    container: ${{ matrix.image }}
    steps:
      - name: Install build prerequisites
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl ca-certificates git
          elif command -v dnf >/dev/null; then
            dnf install -y gcc curl ca-certificates git
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed base-devel curl ca-certificates git
          else
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
      - name: Build and fixture tests (not hardware validation)
        shell: bash
        run: |
          . "$HOME/.cargo/env"
          cargo test --locked
          cargo build --release --locked

  portable-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install portable build target
        run: rustup toolchain install 1.85.0 --profile minimal --target x86_64-unknown-linux-musl
      - run: python3 scripts/build-portable.py
      - name: Read-only smoke test
        run: target/portable/x86_64-unknown-linux-musl/release/thinkpad-dashboard scan --json
